<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Система Учета Подписки</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    :root {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --warning: #f59e0b;
      --warning-soft: #fef3c7;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text); }
    body { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    .hidden { display: none !important; }

    #app { height: 100%; display: flex; flex-direction: column; }
    .topbar {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .topbar-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 20px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      min-width: 0;
    }
    .brand img {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8);
      background: white; object-fit: cover;
    }
    .brand h1 { margin: 0; font-size: clamp(1.1rem, 3vw, 2rem); }
    .stats {
      display: flex; gap: 10px; flex-wrap: wrap; background: rgba(15, 23, 42, 0.2); border-radius: 12px; padding: 8px 12px;
    }
    .stat-box { min-width: 100px; padding: 0 8px; border-right: 1px solid rgba(255,255,255,0.2); }
    .stat-box:last-child { border-right: none; }
    .stat-label { display: block; font-size: 12px; opacity: 0.8; }
    .stat-value { font-weight: 700; font-size: clamp(1rem, 2vw, 1.4rem); }

    .toolbar {
      background: white; border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.04);
    }
    .toolbar-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      flex-wrap: wrap;
    }
    .search-wrap {
      position: relative; width: min(100%, 360px);
    }
    .search-wrap input {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 10px 38px; outline: none; background: var(--panel-soft);
    }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 18px;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      border: none; cursor: pointer; border-radius: 10px; padding: 10px 16px; font-weight: 700; transition: 0.15s ease;
    }
    .btn:hover { filter: brightness(0.98); }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-warning { background: var(--warning-soft); color: #b45309; }

    .content {
      flex: 1; overflow: auto; padding: 20px;
    }
    .container { max-width: 1280px; margin: 0 auto; }

    .alert {
      margin: 0 auto 14px; max-width: 1280px; padding: 12px 14px; border-radius: 12px; border: 1px solid transparent; display: flex; align-items: center; gap: 10px; font-weight: 600;
    }
    .alert-error { background: var(--danger-soft); color: #b91c1c; border-color: #fca5a5; }
    .alert-success { background: var(--success-soft); color: #166534; border-color: #86efac; }

    .table-wrap { background: white; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #f8fafc; color: #475569; padding: 14px 12px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      border-bottom: 1px solid var(--line);
    }
    tbody td { vertical-align: top; padding: 12px; border-bottom: 1px solid var(--line); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fbff; }
    .person-box { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
    .person-box:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .person-name { font-weight: 700; margin-bottom: 2px; }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .pill {
      display: inline-block; padding: 4px 8px; border-radius: 999px; color: white; font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .sum { font-weight: 700; color: var(--text); }
    .status-pill {
      display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 700; border: 1px solid transparent;
    }
    .status-paid { background: var(--success-soft); color: var(--success); border-color: #86efac; }
    .status-pending { background: var(--warning-soft); color: #b45309; border-color: #fcd34d; }

    .table-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .icon-btn {
      border: none; background: #eef2ff; color: #1e40af; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 18px;
    }
    .icon-btn.danger { background: var(--danger-soft); color: var(--danger); }
    .icon-btn.active { background: #dbeafe; }

    .empty {
      background: white; border: 1px solid var(--line); padding: 26px; border-radius: 14px; text-align: center; color: var(--muted); box-shadow: var(--shadow);
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    }
    .modal {
      background: white; width: min(100%, 1100px); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 60px rgba(15, 23, 42, 0.25);
      max-height: 94vh; display: flex; flex-direction: column;
    }
    .modal-header {
      background: linear-gradient(135deg, #1d4ed8, #2563eb); color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h2 { margin: 0; }
    .close-btn {
      border: none; background: transparent; cursor: pointer; color: white; font-size: 28px; line-height: 1; padding: 0 6px;
    }
    .modal-body { overflow: auto; padding: 18px; }
    .modal-footer {
      border-top: 1px solid var(--line); background: #f8fafc; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .field, textarea, select, input {
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; background: white;
    }
    textarea { min-height: 90px; resize: vertical; }
    .field:focus, select:focus, textarea:focus, input:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

    .import-section { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 12px; }
    .subscriber-row {
      background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; position: relative;
    }
    .subscriber-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr; gap: 10px; }
    .subscriber-grid .wide { grid-column: span 5; }
    .top-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .num-chip {
      display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #dbeafe; color: #1d4ed8; font-weight: 700;
    }
    .remove-sub-btn { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 22px; }

    .offline-banner {
      display: none; position: sticky; top: 0; z-index: 20; background: #fff7ed; color: #9a5b00; border-bottom: 1px solid #fdba74; padding: 8px 14px; text-align: center; font-weight: 700;
    }
    body.offline .offline-banner { display: block; }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .content { padding: 14px; }
      .toolbar-inner, .topbar-inner { align-items: stretch; }
      .stats { width: 100%; justify-content: space-between; }
      .stat-box { min-width: 0; flex: 1; border-right: none; }
      .table-wrap { overflow: auto; }
      .subscriber-grid { grid-template-columns: 1fr 1fr; }
      .subscriber-grid .wide { grid-column: span 2; }
    }

    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area {
        position: absolute; left: 0; top: 0; width: 100%;
        background: white;
      }
      .print-sheet {
        width: 100%; min-height: 286mm; padding: 8mm; box-sizing: border-box;
        background: white;
      }
      .receipt-item {
        border-bottom: 1px dashed #000; padding: 8px 0; min-height: 46mm; display: flex; flex-direction: column; justify-content: center;
        font-size: 13pt; line-height: 1.2; page-break-inside: avoid;
      }
      .receipt-item:last-child { border-bottom: none; }
      .receipt-line {
        display: inline-block; border-bottom: 1px solid #000; padding: 0 4px; min-width: 70px; font-weight: 700;
      }
      .print-row {
        display: flex; align-items: baseline; gap: 8px; margin: 2px 0;
      }
      .print-header {
        text-align: center; margin-bottom: 8px;
      }
      .print-header strong { font-size: 15pt; display: block; }
      .print-meta {
        display: flex; justify-content: space-between; align-items: end; margin-top: 8px;
      }
      .print-stamp {
        width: 48px; height: 48px; border: 2px solid #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8pt; transform: rotate(-12deg); opacity: 0.3;
      }
      .page-break { page-break-after: always; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const STORAGE_KEY = 'karakiya_subscriptions_v1';
    const SYNC_QUEUE_KEY = 'karakiya_subscriptions_sync_queue_v1';
    const TABLE_NAME = 'subscriptions';
    const SUPABASE_URL = 'https://cyrqmfaxouhkojpgdyzz.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const SUB_TYPES = {
      editorial: { id: 'editorial', label: 'Редакция', defaultAmount: 5520 },
      kazpost: { id: 'kazpost', label: 'KazPost', defaultAmount: 7689.84 }
    };

    const DURATION_OPTIONS = [
      { months: 12, label: '12 ай (1 жыл)', defaultText: '12 ай' },
      { months: 6, label: '6 ай', defaultText: '6 ай' }
    ];

    const state = {
      items: loadLocalData(),
      filterText: '',
      modal: null,
      printData: null,
      statusMessage: '',
      statusType: 'success'
    };

    function getDefaultType() { return SUB_TYPES.editorial; }
    function getTypeById(id) { return SUB_TYPES[id] || getDefaultType(); }
    function calculatePrice(typeId, months) {
      const item = getTypeById(typeId);
      return Math.round((item.defaultAmount / 12) * months);
    }

    function loadLocalData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveLocalData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.items)); }

    function loadSyncQueue() {
      try {
        const raw = localStorage.getItem(SYNC_QUEUE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveSyncQueue(queue) { localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(queue)); }

    function addToSyncQueue(entry) {
      const queue = loadSyncQueue();
      queue.push(entry);
      saveSyncQueue(queue);
    }

    function makeId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function getNextCustomId() {
      const maxId = state.items.reduce((max, item) => Math.max(max, Number(item.custom_id || 0)), 2025);
      return maxId + 1;
    }

    function formatMoney(value) {
      return Number(value || 0).toLocaleString('ru-RU') + ' ₸';
    }

    function getFilteredItems() {
      const query = state.filterText.trim().toLowerCase();
      if (!query) return state.items;
      return state.items.filter(item => {
        const searchText = [
          item.custom_id,
          item.status,
          ...(item.subscribers || []).map(s => `${s.name} ${s.org || ''} ${s.period || ''}`)
        ].join(' ').toLowerCase();
        return searchText.includes(query);
      });
    }

    function getStats() {
      const total = state.items.reduce((sum, item) => sum + (Number(item.total_amount) || 0), 0);
      const paid = state.items.filter(item => item.status === 'paid').reduce((sum, item) => sum + (Number(item.total_amount) || 0), 0);
      const pending = total - paid;
      const count = state.items.reduce((sum, item) => sum + ((item.subscribers || []).length || 0), 0);
      return { total, paid, pending, count };
    }

    function getSubscriberLabel(typeId) { return getTypeById(typeId).label; }

    function createEmptySubscriber() {
      return {
        name: '',
        org: '',
        period: '12 ай',
        amount: 5520,
        months: 12,
        type: 'editorial'
      };
    }

    function prepareItemForSave(item) {
      const validSubscribers = (item.subscribers || []).filter(sub => String(sub.name || '').trim());
      const totalAmount = validSubscribers.reduce((sum, sub) => sum + (Number(sub.amount) || 0), 0);
      return {
        ...item,
        subscribers: validSubscribers.map(sub => ({
          ...sub,
          name: String(sub.name || '').trim(),
          org: String(sub.org || '').trim(),
          period: String(sub.period || '').trim() || '12 ай',
          amount: Number(sub.amount || 0),
          months: Number(sub.months || 12),
          type: sub.type || 'editorial'
        })),
        total_amount: totalAmount,
        status: item.status || 'pending'
      };
    }

    function normalizeItem(input) {
      if (!input || !Array.isArray(input.subscribers)) return null;
      const item = prepareItemForSave({
        id: input.id || makeId(),
        custom_id: input.custom_id || getNextCustomId(),
        subscribers: input.subscribers,
        total_amount: input.total_amount || 0,
        status: input.status || 'pending',
        created_at: input.created_at || new Date().toISOString()
      });
      return item;
    }

    function addStatusMessage(message, type = 'success') {
      state.statusMessage = message;
      state.statusType = type;
      render();
      setTimeout(() => {
        if (state.statusMessage === message) {
          state.statusMessage = '';
          render();
        }
      }, 2200);
    }

    function saveAndSync() {
      saveLocalData();
      syncIfPossible();
    }

    async function syncIfPossible() {
      if (!navigator.onLine) return;
      if (!window.supabase || !window.supabase.createClient) return;

      const queue = loadSyncQueue();
      if (!queue.length) return;

      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        for (const entry of queue) {
          if (entry.type === 'insert') {
            await client.from(TABLE_NAME).insert([entry.data]);
          }
          if (entry.type === 'update') {
            await client.from(TABLE_NAME).update(entry.data).eq('id', entry.id);
          }
          if (entry.type === 'delete') {
            await client.from(TABLE_NAME).delete().eq('id', entry.id);
          }
        }
        saveSyncQueue([]);
      } catch (e) {
        console.warn('Supabase sync failed', e);
      }
    }

    function deleteEntry(id) {
      const item = state.items.find(x => x.id === id);
      if (!item) return;
      state.items = state.items.filter(x => x.id !== id);
      addToSyncQueue({ type: 'delete', id });
      saveLocalData();
      syncIfPossible();
      render();
    }

    function toggleStatus(id) {
      state.items = state.items.map(item => {
        if (item.id !== id) return item;
        return { ...item, status: item.status === 'paid' ? 'pending' : 'paid' };
      });
      saveAndSync();
      render();
    }

    function openAddModal() {
      state.modal = {
        mode: 'add',
        data: {
          id: makeId(),
          custom_id: getNextCustomId(),
          status: 'pending',
          subscribers: [createEmptySubscriber()]
        }
      };
      render();
    }

    function openEditModal(item) {
      state.modal = {
        mode: 'edit',
        data: {
          ...item,
          subscribers: Array.isArray(item.subscribers) ? item.subscribers.map(s => ({ ...s, amount: Number(s.amount || 0), months: Number(s.months || 12) })) : [createEmptySubscriber()]
        }
      };
      render();
    }

    function closeModal() {
      state.modal = null;
      render();
    }

    function openImportModal() {
      state.modal = {
        mode: 'import',
        importData: {
          text: '',
          org: '',
          type: 'editorial',
          months: 12,
          period: '12 ай',
          targetItemId: null
        }
      };
      render();
    }

    function removeSubscriberFromModal(index) {
      if (!state.modal || !state.modal.data) return;
      const subscribers = [...state.modal.data.subscribers];
      if (subscribers.length <= 1) return;
      subscribers.splice(index, 1);
      state.modal.data.subscribers = subscribers;
      render();
    }

    function addSubscriberToModal() {
      if (!state.modal || !state.modal.data) return;
      const current = state.modal.data.subscribers || [];
      current.push({ ...createEmptySubscriber(), amount: calculatePrice(current[current.length - 1]?.type || 'editorial', current[current.length - 1]?.months || 12) });
      state.modal.data.subscribers = current;
      render();
    }

    function updateModalSubscriber(index, field, value) {
      if (!state.modal || !state.modal.data || !state.modal.data.subscribers) return;
      const subs = [...state.modal.data.subscribers];
      subs[index] = { ...subs[index], [field]: value };

      if (field === 'type') {
        subs[index].amount = calculatePrice(value, Number(subs[index].months || 12));
      }
      if (field === 'months') {
        const months = Number(value || 12);
        subs[index].months = months;
        subs[index].amount = calculatePrice(subs[index].type || 'editorial', months);
        const option = DURATION_OPTIONS.find(o => o.months === months);
        if (option) subs[index].period = option.defaultText;
      }

      state.modal.data.subscribers = subs;
      render();
    }

    function handleModalSubmit() {
      if (!state.modal || !state.modal.data) return;
      const item = prepareItemForSave({
        ...state.modal.data,
        custom_id: state.modal.data.custom_id || getNextCustomId(),
        status: state.modal.data.status || 'pending',
        id: state.modal.data.id || makeId(),
        created_at: state.modal.data.created_at || new Date().toISOString()
      });

      if (state.modal.mode === 'add') {
        state.items = [item, ...state.items];
        addStatusMessage('Заявка добавлена локально', 'success');
      } else {
        state.items = state.items.map(x => x.id === item.id ? item : x);
        addStatusMessage('Заявка обновлена', 'success');
      }

      saveAndSync();
      closeModal();
      render();
    }

    function applyImport() {
      if (!state.modal || state.modal.mode !== 'import') return;
      const text = state.modal.importData.text || '';
      const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
      if (!lines.length) {
        addStatusMessage('Введите имена для импорта', 'error');
        return;
      }

      const imported = lines.map(name => ({
        name,
        org: state.modal.importData.org || '',
        period: state.modal.importData.period || '12 ай',
        amount: calculatePrice(state.modal.importData.type || 'editorial', Number(state.modal.importData.months || 12)),
        type: state.modal.importData.type || 'editorial',
        months: Number(state.modal.importData.months || 12)
      }));

      const targetId = state.modal.importData.targetItemId;
      if (targetId) {
        const existing = state.items.find(item => item.id === targetId);
        if (!existing) return;
        const merged = [...(existing.subscribers || []), ...imported];
        const updated = prepareItemForSave({ ...existing, subscribers: merged, total_amount: merged.reduce((sum, s) => sum + (Number(s.amount) || 0), 0) });
        state.items = state.items.map(item => item.id === targetId ? updated : item);
      } else {
        const newItem = prepareItemForSave({
          id: makeId(),
          custom_id: getNextCustomId(),
          status: 'pending',
          created_at: new Date().toISOString(),
          subscribers: imported
        });
        state.items = [newItem, ...state.items];
      }

      saveAndSync();
      closeModal();
      render();
    }

    function handlePrint(item) {
      state.printData = item;
      render();
      setTimeout(() => window.print(), 120);
    }

    function renderReceiptPrint(data) {
      if (!data || !data.subscribers || !data.subscribers.length) return '';
      const chunks = [];
      for (let i = 0; i < data.subscribers.length; i += 5) {
        chunks.push(data.subscribers.slice(i, i + 5));
      }

      return `
        <div class="print-area">
          ${chunks.map((chunk, pageIndex) => `
            <div class="print-sheet ${pageIndex > 0 ? 'page-break' : ''}">
              ${chunk.map(sub => `
                <div class="receipt-item">
                  <div class="print-header">
                    <strong>Төлем туралы анықтама</strong>
                    <div>«Қарақия» газеті</div>
                    <div>Тип подписки: ${getTypeById(sub.type).label}</div>
                  </div>

                  <div class="print-row"><span>Мекеме атауы</span><span class="receipt-line">${sub.org || '_________________'}</span></div>
                  <div class="print-row"><span>Аты-жөні</span><span class="receipt-line">${sub.name || '_________________'}</span><span>(жазылған адам саны <strong>1</strong>)</span></div>
                  <div class="print-row"><span>Аудандық қоғамдық-саяси газетіне</span><span class="receipt-line">${sub.period || '12 ай'}</span><span> мерзімге жазылды.</span></div>
                  <div class="print-row"><span>Төленген сома:</span><span class="receipt-line">${formatMoney(sub.amount)}</span></div>

                  <div class="print-meta">
                    <div><div class="receipt-line" style="min-width:100px;">${new Date().toLocaleDateString('ru-RU')}</div><div style="text-align:center; margin-top:4px;">Берілген күні</div></div>
                    <div><div class="receipt-line" style="min-width:120px;">&nbsp;</div><div style="text-align:center; margin-top:4px;">Кассирдің қолы</div></div>
                    <div class="print-stamp">печать</div>
                  </div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderModal() {
      if (!state.modal) return '';
      const modal = state.modal;

      if (modal.mode === 'add' || modal.mode === 'edit') {
        const item = modal.data;
        return `
          <div class="modal-backdrop">
            <div class="modal">
              <div class="modal-header">
                <h2>${modal.mode === 'edit' ? 'Редактирование' : 'Новая заявка'}</h2>
                <button type="button" class="close-btn" data-action="close-modal">×</button>
              </div>
              <div class="modal-body">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
                  <h3 style="margin:0;">Подписчики</h3>
                  <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button type="button" class="btn btn-success" data-action="open-import-modal-in-editor">Импорт текста</button>
                    <button type="button" class="btn btn-primary" data-action="add-subscriber-to-modal">Добавить подписчика</button>
                  </div>
                </div>

                ${(item.subscribers || []).map((sub, index) => `
                  <div class="subscriber-row">
                    <div class="top-line">
                      <div class="num-chip">${index + 1}</div>
                      ${(item.subscribers.length > 1) ? `<button type="button" class="remove-sub-btn" data-action="remove-subscriber" data-index="${index}" title="Удалить">×</button>` : ''}
                    </div>

                    <div class="subscriber-grid">
                      <div class="form-group">
                        <label class="label">ФИО</label>
                        <input class="field" value="${escapeHtml(sub.name || '')}" data-action="modal-subscriber-input" data-index="${index}" data-field="name" />
                      </div>

                      <div class="form-group">
                        <label class="label">Тип</label>
                        <select class="field" data-action="modal-subscriber-input" data-index="${index}" data-field="type">
                          ${Object.values(SUB_TYPES).map(t => `<option value="${t.id}" ${sub.type === t.id ? 'selected' : ''}>${t.label}</option>`).join('')}
                        </select>
                      </div>

                      <div class="form-group">
                        <label class="label">Срок</label>
                        <select class="field" data-action="modal-subscriber-input" data-index="${index}" data-field="months">
                          ${DURATION_OPTIONS.map(opt => `<option value="${opt.months}" ${Number(sub.months || 12) === opt.months ? 'selected' : ''}>${opt.label}</option>`).join('')}
                        </select>
                      </div>

                      <div class="form-group">
                        <label class="label">Сумма</label>
                        <input class="field" type="number" value="${Number(sub.amount || 0)}" data-action="modal-subscriber-input" data-index="${index}" data-field="amount" />
                      </div>

                      <div class="form-group">
                        <label class="label">Организация</label>
                        <input class="field" value="${escapeHtml(sub.org || '')}" data-action="modal-subscriber-input" data-index="${index}" data-field="org" />
                      </div>

                      <div class="form-group wide">
                        <label class="label">Текст периода в квитанции</label>
                        <input class="field" value="${escapeHtml(sub.period || '')}" data-action="modal-subscriber-input" data-index="${index}" data-field="period" />
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>

              <div class="modal-footer">
                <div style="font-size:1.15rem; font-weight:700;">Итого: <span>${formatMoney((item.subscribers || []).reduce((sum, s) => sum + (Number(s.amount) || 0), 0))}</span></div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  <button type="button" class="btn btn-secondary" data-action="close-modal">Отмена</button>
                  <button type="button" class="btn btn-primary" data-action="submit-modal">Сохранить</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (modal.mode === 'import') {
        const importData = modal.importData || {};
        return `
          <div class="modal-backdrop">
            <div class="modal" style="max-width:700px;">
              <div class="modal-header">
                <h2>Импорт из текста</h2>
                <button type="button" class="close-btn" data-action="close-modal">×</button>
              </div>
              <div class="modal-body">
                <div class="import-section">
                  <textarea placeholder="Иванов И.И.\nПетров П.П." data-import-field="text">${escapeHtml(importData.text || '')}</textarea>
                </div>
                <div class="settings-grid">
                  <div class="form-group">
                    <label class="label">Тип подписки</label>
                    <select data-import-field="type">
                      ${Object.values(SUB_TYPES).map(t => `<option value="${t.id}" ${importData.type === t.id ? 'selected' : ''}>${t.label}</option>`).join('')}
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="label">Длительность</label>
                    <select data-import-field="months">
                      ${DURATION_OPTIONS.map(opt => `<option value="${opt.months}" ${Number(importData.months || 12) === opt.months ? 'selected' : ''}>${opt.label}</option>`).join('')}
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="label">Текст периода</label>
                    <input class="field" value="${escapeHtml(importData.period || '12 ай')}" data-import-field="period" />
                  </div>
                  <div class="form-group">
                    <label class="label">Сумма по умолчанию</label>
                    <input class="field" type="number" value="${calculatePrice(importData.type || 'editorial', Number(importData.months || 12))}" readonly />
                  </div>
                  <div class="form-group" style="grid-column:1 / -1;">
                    <label class="label">Организация</label>
                    <input class="field" value="${escapeHtml(importData.org || '')}" data-import-field="org" />
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <div></div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  <button type="button" class="btn btn-secondary" data-action="close-modal">Отмена</button>
                  <button type="button" class="btn btn-success" data-action="apply-import">Добавить</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      return '';
    }

    function render() {
      const stats = getStats();
      const filtered = getFilteredItems();

      document.getElementById('app').innerHTML = `
        <div class="offline-banner">Офлайн режим: данные сохраняются локально и синхронизируются при подключении к сети.</div>
        <header class="topbar">
          <div class="topbar-inner">
            <div class="brand">
              <img src="logo.png" alt="logo" />
              <h1>Система Учета Подписки</h1>
            </div>
            <div class="stats">
              <div class="stat-box">
                <span class="stat-label">Всего</span>
                <span class="stat-value">${formatMoney(stats.total)}</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Ожидается</span>
                <span class="stat-value">${formatMoney(stats.pending)}</span>
              </div>
              <div class="stat-box">
                <span class="stat-label">Оплачено</span>
                <span class="stat-value" style="color:#86efac;">${formatMoney(stats.paid)}</span>
              </div>
            </div>
          </div>
        </header>

        <div class="toolbar">
          <div class="toolbar-inner">
            <div class="search-wrap">
              <span class="search-icon">⌕</span>
              <input type="text" value="${escapeHtml(state.filterText)}" placeholder="Поиск..." data-action="filter-input" />
            </div>
            <div class="actions">
              <button type="button" class="btn btn-primary" data-action="add-entry">Добавить</button>
            </div>
          </div>
        </div>

        ${state.statusMessage ? `<div class="alert alert-${state.statusType === 'error' ? 'error' : 'success'}">${state.statusMessage}</div>` : ''}

        <main class="content">
          <div class="container">
            ${filtered.length ? `
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th style="width:40%;">Подписчик / Тип</th>
                      <th style="width:15%;">Период</th>
                      <th style="width:15%;">Сумма</th>
                      <th style="width:15%;">Статус</th>
                      <th style="width:15%; text-align:center;">Действия</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filtered.map(item => `
                      <tr>
                        <td>
                          ${(item.subscribers || []).map(sub => `
                            <div class="person-box">
                              <div class="person-name">${escapeHtml(sub.name || '')}</div>
                              <div class="meta">
                                <span class="pill" style="background:${getTypeById(sub.type).id === 'editorial' ? '#fbbf24' : '#2563eb'}; color:${getTypeById(sub.type).id === 'editorial' ? '#3f2d00' : '#ffffff'};">${getSubscriberLabel(sub.type)}</span>
                                <span class="sum">${formatMoney(sub.amount || 0)}</span>
                              </div>
                              ${sub.org ? `<div style="color:#64748b; font-size:12px; margin-top:4px;">${escapeHtml(sub.org)}</div>` : ''}
                            </div>
                          `).join('')}
                        </td>
                        <td>
                          ${(item.subscribers || []).map(sub => `<div class="person-box" style="border:none; padding-bottom:0; margin:0;">${escapeHtml(sub.period || '')}</div>`).join('')}
                        </td>
                        <td>
                          ${(item.subscribers || []).map(sub => `<div class="person-box" style="border:none; padding-bottom:0; margin:0;">${formatMoney(sub.amount || 0)}</div>`).join('')}
                        </td>
                        <td>
                          <button type="button" class="status-pill ${item.status === 'paid' ? 'status-paid' : 'status-pending'}" data-action="toggle-status" data-id="${item.id}">
                            ${item.status === 'paid' ? 'Оплачено' : 'Ожидается'}
                          </button>
                        </td>
                        <td>
                          <div class="table-actions">
                            <button type="button" class="icon-btn" title="Печать" data-action="print-item" data-id="${item.id}">🖨️</button>
                            <button type="button" class="icon-btn" title="Редактировать" data-action="edit-item" data-id="${item.id}">✏️</button>
                            <button type="button" class="icon-btn danger" title="Удалить" data-action="delete-item" data-id="${item.id}">🗑️</button>
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : `<div class="empty">Нет данных. Добавьте первую заявку.</div>`}
          </div>
        </main>
      ` + renderModal() + (state.printData ? `<div class="print-area">${renderReceiptPrint(state.printData)}</div>` : '');

      document.body.classList.toggle('offline', !navigator.onLine);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.addEventListener('click', (event) => {
      const actionTarget = event.target.closest('[data-action]');
      if (!actionTarget) return;
      const { action, id, index } = actionTarget.dataset;

      if (action === 'add-entry') openAddModal();
      if (action === 'close-modal') closeModal();
      if (action === 'toggle-status') toggleStatus(id);
      if (action === 'print-item') {
        const item = state.items.find(x => x.id === id);
        if (item) handlePrint(item);
      }
      if (action === 'edit-item') {
        const item = state.items.find(x => x.id === id);
        if (item) openEditModal(item);
      }
      if (action === 'delete-item') {
        if (confirm('Удалить заявку?')) deleteEntry(id);
      }
      if (action === 'add-subscriber-to-modal') addSubscriberToModal();
      if (action === 'remove-subscriber') removeSubscriberFromModal(Number(index));
      if (action === 'submit-modal') handleModalSubmit();
      if (action === 'apply-import') applyImport();
      if (action === 'open-import-modal-in-editor') {
        if (!state.modal || !state.modal.data) return;
        state.modal.mode = 'import';
        state.modal.importData = {
          text: '',
          org: '',
          type: state.modal.data.subscribers?.[0]?.type || 'editorial',
          months: state.modal.data.subscribers?.[0]?.months || 12,
          period: state.modal.data.subscribers?.[0]?.period || '12 ай',
          targetItemId: state.modal.data.id
        };
        render();
      }
    });

    document.addEventListener('input', (event) => {
      const target = event.target;
      if (target.matches('[data-action="filter-input"]')) {
        state.filterText = target.value;
        render();
      }

      if (target.hasAttribute('data-import-field')) {
        const field = target.dataset.importField;
        if (!state.modal || state.modal.mode !== 'import') return;
        if (!state.modal.importData) state.modal.importData = {};
        state.modal.importData[field] = target.value;
        render();
      }

      if (target.dataset.action === 'modal-subscriber-input') {
        const index = Number(target.dataset.index);
        const field = target.dataset.field;
        updateModalSubscriber(index, field, target.value);
      }
    });

    document.addEventListener('change', (event) => {
      const target = event.target;
      if (target.hasAttribute('data-import-field')) {
        const field = target.dataset.importField;
        if (!state.modal || state.modal.mode !== 'import') return;
        if (!state.modal.importData) state.modal.importData = {};
        state.modal.importData[field] = target.value;
        render();
      }

      if (target.dataset.action === 'modal-subscriber-input') {
        const index = Number(target.dataset.index);
        const field = target.dataset.field;
        updateModalSubscriber(index, field, target.value);
      }
    });

    window.addEventListener('online', () => {
      document.body.classList.remove('offline');
      syncIfPossible();
      addStatusMessage('Соединение восстановлено, идёт синхронизация', 'success');
    });

    window.addEventListener('offline', () => {
      document.body.classList.add('offline');
      addStatusMessage('Офлайн режим включён', 'error');
    });

    function seedDemoData() {
      if (state.items.length) return;
      state.items = [{
        id: makeId(),
        custom_id: 1001,
        status: 'pending',
        created_at: new Date().toISOString(),
        subscribers: [
          { name: 'Иванов Иван Иванович', org: 'Школа №5', period: '12 ай', amount: 5520, months: 12, type: 'editorial' },
          { name: 'Петров Петр Петрович', org: 'Магазин 1', period: '6 ай', amount: 2760, months: 6, type: 'editorial' }
        ],
        total_amount: 8280
      }];
      saveLocalData();
    }

    seedDemoData();
    render();
    syncIfPossible();
  </script>
</body>
</html>
